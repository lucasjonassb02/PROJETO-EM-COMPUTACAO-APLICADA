<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .input-group-text { cursor: pointer; }
        .password-strength-bar { height: 5px; transition: all 0.3s ease; width: 0%; }
    </style>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
</head>
<body class="bg-body-tertiary d-flex align-items-center vh-100">
    <div class="container card p-4 shadow border-0" style="max-width: 420px; border-radius: 16px;">
        <div class="text-center mb-3">
            <div class="bg-success bg-opacity-10 text-success d-inline-block p-3 rounded-circle mb-2">
                <i class="bi bi-person-plus fs-3"></i>
            </div>
            <h3 class="fw-bold m-0">Criar Conta</h3>
            <p class="text-muted small">Preencha os dados abaixo para começar</p>
        </div>
        
        <form method="POST" action="" class="needs-validation" novalidate>
            <div class="mb-3">
                <label class="form-label small fw-bold">Nome Completo</label>
                <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="nome" id="nomeInput" class="form-control" placeholder="Ex: Lucas Silva" required minlength="3">
                    <div class="invalid-feedback">O nome deve conter pelo menos 3 caracteres.</div>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label small fw-bold">E-mail</label>
                <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" id="emailInput" class="form-control" placeholder="seu@email.com" required>
                    <div class="invalid-feedback">Por favor, insira um e-mail válido.</div>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label small fw-bold">Nome de Usuário (Login)</label>
                <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-at"></i></span>
                    <input type="text" name="usuario" id="userInput" class="form-control" placeholder="Ex: lucas123" required minlength="4">
                    <div class="invalid-feedback">O usuário precisa ter 4 ou mais caracteres.</div>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label small fw-bold">Senha</label>
                <div class="input-group has-validation">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="senha" id="senhaInput" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
                    <span class="input-group-text" onclick="togglePasswordVisibility()"><i class="bi bi-eye" id="toggleIcon"></i></span>
                    <div class="invalid-feedback">A senha deve ter no mínimo 6 caracteres.</div>
                </div>
                <div class="progress mt-2" style="height: 5px;">
                    <div id="strengthBar" class="progress-bar password-strength-bar" role="progressbar"></div>
                </div>
                <small id="strengthText" class="form-text text-muted small"></small>
            </div>
            
            <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-3 shadow-sm"><i class="bi bi-check-circle me-2"></i>Finalizar Cadastro</button>
        </form>
        
        <div class="text-center border-top pt-3">
            <a href="/login" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i>Já tem conta? Faça Login</a>
        </div>
    </div>
    
    <script>
        function togglePasswordVisibility() {
            const senhaInput = document.getElementById('senhaInput');
            const toggleIcon = document.getElementById('toggleIcon');
            if (senhaInput.type === 'password') {
                senhaInput.type = 'text';
                toggleIcon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                senhaInput.type = 'password';
                toggleIcon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.form-control');
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    if (input.checkValidity()) {
                        input.classList.remove('is-invalid');
                        input.classList.add('is-valid');
                    } else {
                        input.classList.remove('is-valid');
                        input.classList.add('is-invalid');
                    }
                });
            });

            const senhaInput = document.getElementById('senhaInput');
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');

            senhaInput.addEventListener('input', () => {
                const val = senhaInput.value;
                let score = 0;
                if (val.length >= 6) score++;
                if (/[A-Z]/.test(val)) score++;
                if (/[0-9]/.test(val)) score++;
                if (/[^A-Za-z0-9]/.test(val)) score++;

                strengthBar.className = 'progress-bar password-strength-bar';
                if (val.length === 0) {
                    strengthBar.style.width = '0%';
                    strengthText.textContent = '';
                } else if (score <= 1) {
                    strengthBar.style.width = '33%';
                    strengthBar.classList.add('bg-danger');
                    strengthText.textContent = 'Senha fraca ⚠️';
                } else if (score <= 3) {
                    strengthBar.style.width = '66%';
                    strengthBar.classList.add('bg-warning');
                    strengthText.textContent = 'Senha média 😐';
                } else {
                    strengthBar.style.width = '100%';
                    strengthBar.classList.add('bg-success');
                    strengthText.textContent = 'Senha forte! 💪';
                }
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
