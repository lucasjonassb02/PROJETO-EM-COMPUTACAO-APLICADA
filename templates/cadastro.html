<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container card p-4 shadow-sm" style="max-width: 400px;">
        <h3 class="text-center">Criar Conta</h3>
        <hr>
        <form method="POST">
            <label class="form-label">Nome Completo:</label>
            <input type="text" name="nome" class="form-control mb-3" placeholder="Ex: Lucas Silva" required>
            
            <label class="form-label">E-mail:</label>
            <input type="email" name="email" class="form-control mb-3" placeholder="seu@email.com" required>
            
            <label class="form-label">Nome de Usuário (Login):</label>
            <input type="text" name="usuario" class="form-control mb-3" placeholder="Ex: lucas123" required>
            
            <label class="form-label">Senha:</label>
            <input type="password" name="senha" class="form-control mb-3" placeholder="Sua senha" required>
            
            <button class="btn btn-success w-100 mb-2">Finalizar Cadastro</button>
        </form>
        
        <div class="text-center mt-2">
            <a href="/login" class="text-decoration-none text-muted">← Já tem conta? Faça Login</a>
        </div>
    </div>
</body>
