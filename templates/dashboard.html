<!DOCTYPE html>
<html lang="pt-br" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema | Painel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; }
        .navbar { background-color: #1a1d20 !important; }
        .welcome-section { 
            border-left: 5px solid #0d6efd; 
            background-color: var(--bs-tertiary-bg);
        }
        .card-shortcut { transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; text-decoration: none; color: inherit; background-color: var(--bs-card-bg); }
        .card-shortcut:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
        
        .theme-toggle-btn {
            background: transparent;
            border: 1px solid #444;
            color: #fff;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .theme-toggle-btn:hover { background: #333; border-color: #666; }
        
        /* Ajuste fino para a foto do menu superior ficar centralizada com o texto */
        .img-nav {
            width: 26px;
            height: 26px;
            object-fit: cover;
        }
        /* Ajuste fino para a foto grande do cabeçalho */
        .img-welcome {
            width: 80px;
            height: 80px;
            object-fit: cover;
        }
    </style>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || "{{ user.tema if user and user.tema else 'light' }}";
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            localStorage.setItem('theme', savedTheme);
            
            const style = document.createElement('style');
            style.innerHTML = savedTheme === 'dark' 
                ? '.theme-toggle-btn i::before { content: "\\f494" !important; }' 
                : '.theme-toggle-btn i::before { content: "\\f5aba" !important; }'; 
            document.head.appendChild(style);
        })();
    </script>
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/dashboard"><i class="bi bi-layers-half me-2"></i>SISTEMA</a>
        
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="/dashboard"><i class="bi bi-house-door me-1"></i>Início</a></li>
            </ul>
            
            <div class="d-flex align-items-center">
                <button onclick="toggleTheme()" class="theme-toggle-btn me-3" title="Alternar Tema">
                    <i class="bi bi-sun-fill" id="themeIcon"></i>
                </button>

                <div class="dropdown">
                    <button class="btn btn-dark dropdown-toggle border-secondary d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                        <img src="{{ user.foto }}" class="rounded-circle img-nav border border-light border-opacity-50" alt="Foto Mini">
                        {{ user.nome }}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" href="/perfil"><i class="bi bi-gear me-2"></i>Perfil / Tema</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Sair</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="welcome-section p-5 mb-5 rounded-4 shadow-sm border-0 d-flex align-items-center gap-4 flex-wrap flex-sm-nowrap">
        <div>
            <img src="{{ user.foto }}" class="rounded-circle shadow img-welcome border border-3 border-white" alt="Avatar Usuário">
        </div>
        <div>
            <h1 class="display-6 fw-bold m-0">Olá, {{ user.nome }}!</h1>
            <p class="text-muted mb-0 mt-1">Bem-vindo ao seu painel de controle. O que deseja fazer hoje?</p>
        </div>
    </div>

    <div class="row g-4">
        {% if 'relatorios' in user.permissoes %}
        <div class="col-md-4">
            <a href="/relatorios" class="card h-100 border-0 shadow-sm card-shortcut p-4">
                <div class="d-flex align-items-center">
                    <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3 text-primary"><i class="bi bi-bar-chart-line fs-3"></i></div>
                    <div><h5 class="mb-1 fw-bold">Relatórios</h5><small class="text-muted">Análises e dados</small></div>
                </div>
            </a>
        </div>
        {% endif %}

        {% if 'usuarios_gestao' in user.permissoes %}
        <div class="col-md-4">
            <a href="/usuarios_gestao" class="card h-100 border-0 shadow-sm card-shortcut p-4">
                <div class="d-flex align-items-center">
                    <div class="bg-success bg-opacity-10 p-3 rounded-3 me-3 text-success"><i class="bi bi-people fs-3"></i></div>
                    <div><h5 class="mb-1 fw-bold">Usuários</h5><small class="text-muted">Gerenciar acessos</small></div>
                </div>
            </a>
        </div>
        {% endif %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function updateIcon(theme) {
        const themeIcon = document.getElementById('themeIcon');
        if (theme === 'dark') {
            themeIcon.classList.replace('bi-sun-fill', 'bi-moon-stars-fill');
        } else {
            themeIcon.classList.replace('bi-moon-stars-fill', 'bi-sun-fill');
        }
    }

    function toggleTheme() {
        const htmlElement = document.documentElement;
        const currentTheme = htmlElement.getAttribute('data-bs-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        
        htmlElement.setAttribute('data-bs-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateIcon(newTheme);
        
        const formData = new FormData();
        formData.append('tema', newTheme);
        fetch('/mudar_tema', {method: 'POST', body: formData});
    }

    window.addEventListener('DOMContentLoaded', () => {
        const currentTheme = document.documentElement.getAttribute('data-bs-theme');
        updateIcon(currentTheme);
    });
</script>
</body>
</html>
