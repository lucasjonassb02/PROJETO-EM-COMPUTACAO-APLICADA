<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<div class="container mt-5" style="max-width: 500px;">
    <h3>Editando: {{ username }}</h3>
    <form method="POST" class="card p-4 shadow">
        <label>Nome Real:</label>
        <input type="text" name="nome" value="{{ u.nome }}" class="form-control mb-3">
        <label>Email:</label>
        <input type="email" name="email" value="{{ u.email }}" class="form-control mb-3">
        <label>Nova Senha:</label>
        <input type="text" name="senha" value="{{ u.senha }}" class="form-control mb-3">
        <button class="btn btn-success w-100">Salvar Alterações</button>
        <a href="/usuarios_gestao" class="btn btn-link w-100 mt-2">Cancelar</a>
    </form>
</div>
