<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container card p-4 shadow-sm" style="max-width: 400px;">
        <h3 class="text-center mb-4">Login</h3>
        
        {% if erro %}
        <div class="alert alert-danger text-center" role="alert">
            {{ erro }}
        </div>
        {% endif %}
        <form method="POST">
            <input type="text" name="usuario" class="form-control mb-3" placeholder="Usuário" required>
            <input type="password" name="senha" class="form-control mb-3" placeholder="Senha" required>
            <button class="btn btn-primary w-100">Entrar</button>
        </form>
        <p class="text-center mt-3 mb-0">Não tem conta? <a href="/cadastro">Cadastre-se</a></p>
    </div>
</body>
</html>
