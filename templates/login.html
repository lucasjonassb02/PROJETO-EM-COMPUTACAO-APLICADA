<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
</head>
<body class="bg-body-tertiary d-flex align-items-center vh-100">
    <div class="container card p-4 shadow border-0" style="max-width: 400px; border-radius: 16px;">
        <div class="text-center mb-4">
            <div class="bg-primary bg-opacity-10 text-primary d-inline-block p-3 rounded-circle mb-2">
                <i class="bi bi-shield-lock fs-3"></i>
            </div>
            <h3 class="fw-bold m-0">Acessar Sistema</h3>
            <p class="text-muted small">Insira suas credenciais</p>
        </div>
        
        <form method="POST">
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="usuario" class="form-control" placeholder="Usuário" required>
                </div>
            </div>
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                    <input type="password" name="senha" class="form-control" placeholder="Senha" required>
                </div>
            </div>
            <button class="btn btn-primary w-100 fw-bold py-2 shadow-sm"><i class="bi bi-box-arrow-in-right me-2"></i>Entrar</button>
        </form>
        
        <p class="text-center mt-4 mb-0 small text-muted">
            Não tem conta? <a href="/cadastro" class="text-decoration-none fw-bold">Cadastre-se</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
