<!DOCTYPE html>
<html lang="pt-br" id="html-togle">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | Configurações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || "{{ user.tema if user and user.tema else 'light' }}";
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
</head>
<body class="bg-body-tertiary d-flex align-items-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 p-4 rounded-4">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 text-primary d-inline-block p-3 rounded-circle mb-2">
                        <i class="bi bi-person-gear fs-3"></i>
                    </div>
                    <h2 class="fw-bold m-0">O Meu Perfil</h2>
                    <p class="text-muted small">Gerencie suas preferências de usuário</p>
                </div>
                
                <div class="p-3 bg-light bg-opacity-50 rounded-3 mb-4 border">
                    <p class="mb-2"><strong><i class="bi bi-card-text me-2 text-muted"></i>Nome:</strong> {{ user.nome }}</p>
                    <p class="mb-0"><strong><i class="bi bi-envelope me-2 text-muted"></i>Email:</strong> {{ user.email }}</p>
                </div>

                <h5 class="fw-bold mb-3 small text-uppercase text-muted tracking-wider"><i class="bi bi-palette me-2"></i>Aparência</h5>
                
                <form action="/mudar_tema" method="POST" onsubmit="salvarTemaLocal()">
                    <div class="mb-4">
                        <select name="tema" id="temaSelect" class="form-select form-select-lg" onchange="previewTema(this.value)">
                            <option value="light">☀️ Modo Claro</option>
                            <option value="dark">🌙 Modo Escuro</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold fs-6 shadow-sm">
                        <i class="bi bi-check2-circle me-1"></i> Salvar Preferência
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="/dashboard" class="text-decoration-none text-muted small">
                        <i class="bi bi-arrow-left me-1"></i> Voltar ao Início
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function previewTema(tema) {
        document.documentElement.setAttribute('data-bs-theme', tema);
    }

    function salvarTemaLocal() {
        const temaSelecionado = document.getElementById('temaSelect').value;
        localStorage.setItem('theme', temaSelecionado);
    }

    window.addEventListener('DOMContentLoaded', () => {
        const currentTheme = document.documentElement.getAttribute('data-bs-theme');
        document.getElementById('temaSelect').value = currentTheme;
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
