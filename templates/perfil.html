<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Meu Perfil</title>
    <style>
        .foto-clicavel {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .foto-clicavel:hover {
            opacity: 0.6;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg p-4" style="max-width: 500px; margin: auto;">
            <h2 class="text-primary text-center">Minha Conta</h2>
            <hr>
            
            <div class="text-center mb-4">
                <form method="POST" enctype="multipart/form-data">
                    
                    <label for="upload-foto" title="Clique para trocar de foto">
                        <img src="{{ usuario.foto }}" 
                             alt="Foto de Perfil" 
                             class="rounded-circle shadow mb-2 foto-clicavel border border-3 border-white" 
                             style="width: 120px; height: 120px; object-fit: cover;">
                    </label>
                    
                    <p class="text-muted" style="font-size: 0.85rem;">Clique na foto para alterar</p>

                    <input type="file" id="upload-foto" name="foto_nova" accept="image/*" style="display: none;" onchange="this.form.submit()">
                    
                </form>
            </div>
            <p><strong>Nome de Usuário:</strong> {{ usuario.nome if usuario else session['usuario'] }}</p>
            <p><strong>Status da Conta:</strong> <span class="badge bg-success">Ativo</span></p>
            <a href="/dashboard" class="btn btn-outline-secondary w-100 mt-3">Voltar ao Painel</a>
        </div>
    </div>
</body>
</html>
