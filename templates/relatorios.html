<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Atividade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
</head>
<body class="bg-body-tertiary">

<div class="container mt-5">
    <div class="card shadow border-0 p-4 rounded-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0"><i class="bi bi-journal-text me-2 text-primary"></i>Relatório de Atividade</h2>
                <p class="text-muted small mb-0">Logs em tempo real de ações do sistema</p>
            </div>
            <div>
                <a href="/dashboard" class="btn btn-outline-secondary fw-bold"><i class="bi bi-arrow-left me-1"></i> Voltar</a>
                <a href="/perfil" class="btn btn-warning fw-bold text-dark ms-2"><i class="bi bi-person me-1"></i> Meu Perfil</a>
            </div>
        </div>
        
        <div class="table-responsive">
            <table class="table table-hover align-middle border-top">
                <thead class="table-light">
                    <tr>
                        <th><i class="bi bi-person me-1"></i>Usuário</th>
                        <th><i class="bi bi-activity me-1"></i>Ação / Aba Acessada</th>
                        <th><i class="bi bi-clock me-1"></i>Data e Hora</th>
                    </tr>
                </thead>
                <tbody>
                    {% for log in logs|reverse %}
                    <tr>
                        <td class="fw-semibold">@{{ log.usuario }}</td>
                        <td><span class="badge bg-info bg-opacity-10 text-info px-3 py-2 border border-info border-opacity-20">{{ log.acao }}</span></td>
                        <td class="text-muted small">{{ log.data_hora }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
