<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Atividade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
</head>
<body class="bg-body-tertiary">

<div class="container my-5">
    <div class="card shadow border-0 p-4 rounded-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4flex-wrap gap-3">
            <div>
                <h2 class="fw-bold m-0"><i class="bi bi-journal-text me-2 text-primary"></i>Relatório de Atividade</h2>
                <p class="text-muted small mb-0">Logs em tempo real de ações do sistema</p>
            </div>
            <div>
                <a href="/dashboard" class="btn btn-outline-secondary fw-bold"><i class="bi bi-arrow-left me-1"></i> Voltar</a>
                <a href="/perfil" class="btn btn-warning fw-bold text-dark ms-2"><i class="bi bi-person me-1"></i> Meu Perfil</a>
            </div>
        </div>

        <div class="row g-3 mb-4 p-3 bg-light bg-opacity-50 rounded-3 border">
            <div class="col-md-6">
                <label for="inputBusca" class="form-label fw-bold small text-muted text-uppercase">Buscar por Usuário ou Ação</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-muted"><i class="bi bi-search"></i></span>
                    <input type="text" id="inputBusca" class="form-control" placeholder="Digite para buscar...">
                </div>
            </div>
            <div class="col-md-6">
                <label for="selectAcao" class="form-label fw-bold small text-muted text-uppercase">Filtrar por Tipo de Ação</label>
                <select id="selectAcao" class="form-select">
                    <option value="">Todas as ações</option>
                    <option value="Fez login">Fez login</option>
                    <option value="Fez logout">Fez logout</option>
                    <option value="Criou conta">Criou conta</option>
                    <option value="Editou os dados de perfil">Editou os dados de perfil</option>
                    <option value="Alterou a própria senha">Alterou a própria senha</option>
                    <option value="Atualizou a foto de perfil">Atualizou a foto de perfil</option>
                </select>
            </div>
        </div>
        
        <div class="table-responsive">
            <table class="table table-hover align-middle border-top" id="tabelaLogs">
                <thead class="table-light">
                    <tr>
                        <th><i class="bi bi-person me-1"></i>Usuário</th>
                        <th><i class="bi bi-activity me-1"></i>Ação / Aba Acessada</th>
                        <th><i class="bi bi-clock me-1"></i>Data e Hora</th>
                    </tr>
                </thead>
                <tbody>
                    {% for log in logs|reverse %}
                    <tr>
                        <td class="fw-semibold col-usuario">@{{ log.usuario }}</td>
                        <td class="col-acao">
                            <span class="badge bg-info bg-opacity-10 text-info px-3 py-2 border border-info border-opacity-20">
                                {{ log.acao }}
                            </span>
                        </td>
                        <td class="text-muted small">{{ log.data_hora }}</td>
                    </tr>
                    {% endfor %}
                    <tr id="semResultados" style="display: none;">
                        <td colspan="3" class="text-center text-muted py-4">
                            <i class="bi bi-exclamation-circle fs-4 d-block mb-2"></i>
                            Nenhum registro encontrado para os filtros aplicados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const inputBusca = document.getElementById('inputBusca');
    const selectAcao = document.getElementById('selectAcao');
    const tabela = document.getElementById('tabelaLogs').getElementsByTagName('tbody')[0];
    const linhas = tabela.getElementsByTagName('tr');
    const linhaSemResultados = document.getElementById('semResultados');

    function filtrarTabela() {
        const termoBusca = inputBusca.value.toLowerCase();
        const acaoSelecionada = selectAcao.value.toLowerCase().trim();
        let encontrouAlgum = false;

        for (let i = 0; i < linhas.length; i++) {
            const linha = linhas[i];
            
            // Ignora a linha de "Sem Resultados" no loop de filtragem
            if (linha.id === 'semResultados') continue;

            const elementoUsuario = linha.querySelector('.col-usuario');
            const elementoAcao = linha.querySelector('.col-acao');

            if (!elementoUsuario || !elementoAcao) continue;

            const textoUsuario = elementoUsuario.textContent.toLowerCase();
            const textoAcao = elementoAcao.textContent.toLowerCase();

            const bateBusca = textoUsuario.includes(termoBusca) || textoAcao.includes(termoBusca);
            const bateAcao = acaoSelecionada === "" || textoAcao.trim().includes(acaoSelecionada);

            if (bateBusca && bateAcao) {
                linha.style.display = '';
                encontrouAlgum = true;
            } else {
                linha.style.display = 'none';
            }
        }

        // Exibe mensagem amigável caso a busca zere os resultados
        if (encontrouAlgum) {
            linhaSemResultados.style.display = 'none';
        } else {
            linhaSemResultados.style.display = '';
        }
    }

    inputBusca.addEventListener('keyup', filtrarTabela);
    selectAcao.addEventListener('change', filtrarTabela);
</script>
</body>
</html>
