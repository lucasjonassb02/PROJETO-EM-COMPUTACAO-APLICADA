<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gerenciamento de Usuários</h2>
        <a href="/dashboard" class="btn btn-secondary">← Voltar</a>
    </div>

    <div class="mb-4 bg-light p-3 rounded border">
        <label for="inputBuscaUsuario" class="form-label fw-bold">Buscar Usuário</label>
        <input type="text" id="inputBuscaUsuario" class="form-control" placeholder="Digite o nome, e-mail ou login para filtrar...">
    </div>

    <table class="table table-hover border shadow-sm" id="tabelaUsuarios">
        <thead class="table-dark">
            <tr>
                <th>Nome Real</th>
                <th>E-mail</th>
                <th>Usuário (Login)</th>
                <th>Senha</th>
                <th class="text-center">Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for user_id, dados in lista.items() %}
            <tr>
                <td class="col-nome">{{ dados.nome }}</td>
                <td class="col-email">{{ dados.email }}</td>
                <td class="col-login"><strong>{{ user_id }}</strong></td>
                <td><code>{{ dados.senha }}</code></td>
                <td class="text-center">
                    <a href="/editar/{{ user_id }}" class="btn btn-sm btn-warning">Editar</a>
                    
                    {% if user_id != 'admin' %}
                    <a href="/excluir/{{ user_id }}" 
                       class="btn btn-sm btn-danger" 
                       onclick="return confirm('Tem certeza que deseja excluir este usuário?')">Excluir</a>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<li class="nav-item">
    <a class="nav-link text-warning" href="/perfil">PERFIL</a>
</li>

<script>
    const inputBusca = document.getElementById('inputBuscaUsuario');
    const tabela = document.getElementById('tabelaUsuarios').getElementsByTagName('tbody')[0];
    const linhas = tabela.getElementsByTagName('tr');

    inputBusca.addEventListener('keyup', function() {
        const termoBusca = inputBusca.value.toLowerCase();

        for (let i = 0; i < linhas.length; i++) {
            const linha = linhas[i];
            
            // Pega o texto de cada uma das colunas principais
            const textoNome = linha.querySelector('.col-nome').textContent.toLowerCase();
            const textoEmail = linha.querySelector('.col-email').textContent.toLowerCase();
            const textoLogin = linha.querySelector('.col-login').textContent.toLowerCase();

            // Se o termo digitado estiver em QUALQUER um desses campos, mantém a linha visível
            if (textoNome.includes(termoBusca) || textoEmail.includes(termoBusca) || textoLogin.includes(termoBusca)) {
                linha.style.display = '';
            } else {
                linha.style.display = 'none';
            }
        }
    });
</script>
